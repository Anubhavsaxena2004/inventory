<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Admin Login</title>
    <style>
      /* Basic styles inspired by the provided design image */
      body{font-family:Arial,Helvetica,sans-serif;background:#f3f6fb;margin:0;padding:0;display:flex;align-items:center;justify-content:center;height:100vh}
      .card{width:900px;background:#fff;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,0.08);display:flex;overflow:hidden}
      .left{flex:1;padding:48px;background:linear-gradient(135deg,#f7f8fb,#fff)}
      .right{flex:1;padding:48px}
      .logo{height:48px;margin-bottom:16px}
      h2{margin:0 0 12px 0;font-size:20px;color:#333}
      .input{width:100%;padding:12px 14px;margin:10px 0;border:1px solid #e6e9ef;border-radius:28px}
      .btn{display:inline-block;background:#7b4bff;color:#fff;padding:12px 30px;border-radius:28px;border:0;cursor:pointer;margin-top:12px}
      .meta{font-size:13px;color:#7b7f88;margin-top:10px}
      .illustration{width:100%;height:220px;background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220"></svg>') center/contain no-repeat}
      .center{display:flex;flex-direction:column;justify-content:center;height:100%}
    </style>
  </head>
  <body>
    <div class="card">
      <div class="left">
        <div class="center">
          <img class="logo" src="/static/assets/logo.png" alt="logo" onerror="this.style.display='none'">
          <div class="illustration"></div>
        </div>
      </div>
      <div class="right">
        <h2>Login as a Admin User</h2>
        <form id="loginForm" method="post" action="/admin-login/submit/">
          {% csrf_token %}
          <input class="input" type="email" name="email" placeholder="Email address" required>
          <input class="input" type="password" name="password" placeholder="Password" required>
          <button class="btn" type="submit">LOGIN</button>
        </form>
        <div class="meta">Forgot your password? Contact the site administrator.</div>
        <div style="margin-top:18px;">
          <button id="logoutBtn" class="btn" style="background:#eee;color:#333" onclick="location.href='/admin-logout/'">LOGOUT</button>
        </div>
      </div>
    </div>
  </body>
</html>
