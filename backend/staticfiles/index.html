  <body>
    <div id="root"></div>

    <!-- Ensure readable defaults in case runtime theme code sets low-contrast variables. -->
    <script>
      (function setAccessibleVars(){
        const vars = {
          '--text-primary':'#111827',
          '--text-secondary':'#374151',
          '--text-tertiary':'#6b7280',
          '--bg-primary':'#ffffff',
          '--bg-secondary':'#f8fafc'
        };
        function apply(){
          const root = document.documentElement;
          Object.entries(vars).forEach(([k,v])=>root.style.setProperty(k,v));
        }
        apply();
        window.addEventListener('load', apply);
        setTimeout(apply, 500);
      })();
    </script>

  </body>
